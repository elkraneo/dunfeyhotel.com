name: refresh

# Data refresh only — building and deploying the site is Coolify's job
# (push-to-deploy from this repo's Dockerfile). This workflow updates the
# private data repo, then asks Coolify for a fresh build. force=true skips
# the docker layer cache so the new data is actually cloned.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: elkraneo/dunfey-hotel-data-private
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Fetch snapshot (a 403 here likely means Apple rotated the feed environment)
        run: node etl/fetch.mjs

      - run: node etl/normalize.mjs

      - run: node etl/transcripts-cache.mjs

      - name: Refresh YouTube map (non-fatal — datacenter IPs are sometimes blocked)
        run: |
          pipx install yt-dlp
          node etl/youtube.mjs || echo "::warning::YouTube refresh skipped"

      # Re-normalize so any new YouTube ids land in the dataset.
      - run: node etl/normalize.mjs

      # Validation only: catch broken data before committing and deploying.
      - run: npm run build

      - name: Archive new data
        run: |
          cd data
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "dunfey-refresh"
            git config user.email "refresh@dunfeyhotel.com"
            git add -A
            git commit -m "Automated refresh: $(date -u +%F)"
            git push
          else
            echo "no new data"
          fi

      - name: Commit youtube map if changed
        run: |
          if [ -n "$(git status --porcelain etl/youtube-map.json)" ]; then
            git config user.name "dunfey-refresh"
            git config user.email "refresh@dunfeyhotel.com"
            git add etl/youtube-map.json
            git commit -m "Automated refresh: YouTube map $(date -u +%F)"
            git push
          fi

      - name: Deploy via Coolify
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          curl --fail -sS -X GET \
            -H "Authorization: Bearer $TOKEN" \
            "https://coolify.reality2713.com/api/v1/deploy?uuid=$APP_UUID&force=true"
